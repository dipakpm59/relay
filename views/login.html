<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Relay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/relay.css" />
</head>
<body>
  <nav class="navbar glass px-3 mb-4">
    <div class="container"><a class="brand-mark" href="/">relay</a></div>
  </nav>

  <main class="container" style="max-width: 440px">
    <div class="glass glass-strong p-4 mt-5 fade-up">
      <ul class="nav nav-underline mb-4 justify-content-center" id="modeTabs">
        <li class="nav-item"><button class="nav-link active" data-mode="login">Sign in</button></li>
        <li class="nav-item"><button class="nav-link" data-mode="register">Create account</button></li>
        <li class="nav-item"><button class="nav-link" data-mode="admin">Admin</button></li>
      </ul>

      <div class="mb-3 d-none" id="nameField">
        <label class="form-label small text-soft" for="name">Name</label>
        <input type="text" id="name" class="form-control" autocomplete="name" />
      </div>
      <div class="mb-3">
        <label class="form-label small text-soft" for="email">Email</label>
        <input type="email" id="email" class="form-control" autocomplete="email" />
      </div>
      <div class="mb-3">
        <label class="form-label small text-soft" for="password">Password</label>
        <input type="password" id="password" class="form-control" autocomplete="current-password" />
        <div class="form-text text-soft d-none" id="pwHint">8+ characters with at least one letter and one number.</div>
      </div>

      <p class="small text-danger d-none" id="msg"></p>
      <button class="btn btn-glow w-100" id="submitBtn">Sign in</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
