<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics — Relay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/relay.css" />
</head>
<body>
  <nav class="navbar glass px-3 mb-4">
    <div class="container">
      <a class="brand-mark" href="/">relay</a>
      <div id="navLinks" class="d-flex gap-3 align-items-center"></div>
    </div>
  </nav>

  <main class="container" style="max-width: 1040px">
    <h1 class="h3 fw-bold mt-2">Analytics</h1>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="glass p-3"><div class="stat-n" id="aTotal">–</div><div class="stat-l">Total sent</div></div></div>
      <div class="col-6 col-md-3"><div class="glass p-3"><div class="stat-n" id="aToday">–</div><div class="stat-l">Sent today</div></div></div>
    </div>

    <div class="glass p-4 mb-4">
      <h2 class="h6 text-soft">Your messages — last 30 days</h2>
      <canvas id="myChart" height="90"></canvas>
    </div>

    <div class="glass p-4 mb-5">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="h6 m-0 text-soft">Room activity — last 30 days</h2>
        <select class="form-select form-select-sm w-auto" id="roomSelect"></select>
      </div>
      <canvas id="roomChart" height="110" class="d-none"></canvas>
      <p class="text-soft small m-0" id="roomEmpty">No rooms yet — <a href="/chat">create one</a> to see activity.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/analytics.js"></script>
</body>
</html>
