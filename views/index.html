<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay — real-time chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/relay.css" />
</head>
<body>
  <nav class="navbar glass px-3 mb-4">
    <div class="container">
      <a class="brand-mark" href="/">relay</a>
      <div id="navLinks" class="d-flex gap-3 align-items-center"></div>
    </div>
  </nav>

  <main class="container text-center" style="max-width: 760px">
    <section class="my-5">
      <h1 class="display-5 fw-bold">Talk in real time.</h1>
      <p class="text-soft mx-auto" style="max-width: 520px">
        Rooms, invites with QR codes, live presence and message history —
        broadcast over raw WebSockets, backed by MySQL, cached by a hand-built ring buffer.
      </p>
      <a href="/chat" class="btn btn-glow btn-lg mt-2 px-4">Open chat</a>
    </section>

    <div class="row g-3 my-4 text-start">
      <div class="col-6 col-md-3"><div class="glass p-3 h-100"><div class="mono small text-soft">O(1)</div><strong>Ring-buffered history</strong></div></div>
      <div class="col-6 col-md-3"><div class="glass p-3 h-100"><div class="mono small text-soft">ws</div><strong>Broadcast-first delivery</strong></div></div>
      <div class="col-6 col-md-3"><div class="glass p-3 h-100"><div class="mono small text-soft">jwt</div><strong>Roles &amp; lockout</strong></div></div>
      <div class="col-6 col-md-3"><div class="glass p-3 h-100"><div class="mono small text-soft">mod</div><strong>Reversible moderation</strong></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
</body>
</html>
