<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — Relay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/relay.css" />
</head>
<body>
  <nav class="navbar glass px-3 mb-3">
    <div class="container-fluid" style="max-width: 1240px">
      <a class="brand-mark" href="/">relay</a>
      <div class="d-flex gap-3 align-items-center">
        <span class="conn-badge off" id="connBadge">connecting…</span>
        <div id="navLinks" class="d-flex gap-3 align-items-center"></div>
      </div>
    </div>
  </nav>

  <main class="container-fluid" style="max-width: 1240px">
    <div class="chat-shell">
      <!-- sidebar -->
      <aside class="glass chat-sidebar">
        <div class="p-3 border-bottom" style="border-color: var(--glass-border) !important">
          <div class="d-flex gap-2 mb-2">
            <input type="text" id="newRoomName" class="form-control form-control-sm" placeholder="New room name…" maxlength="50" />
            <button class="btn btn-glow btn-sm" id="createRoomBtn">+</button>
          </div>
          <div class="d-flex gap-2">
            <input type="text" id="joinCode" class="form-control form-control-sm mono" placeholder="Invite code…" maxlength="16" />
            <button class="btn btn-outline-glass btn-sm" id="joinCodeBtn">Join</button>
          </div>
        </div>
        <div class="room-list py-2" id="roomList">
          <p class="text-soft small px-3">Loading rooms…</p>
        </div>
      </aside>

      <!-- main pane -->
      <section class="glass chat-main">
        <div class="chat-header">
          <div>
            <strong id="roomTitle">Pick a room</strong>
            <span class="text-soft small ms-2" id="roomSub"></span>
          </div>
          <div class="d-flex align-items-center flex-wrap" id="roomActions" style="visibility:hidden">
            <span id="onlineList"></span>
            <button class="btn btn-outline-glass btn-sm ms-2" id="inviteBtn">Invite</button>
          </div>
        </div>

        <div class="message-pane" id="messagePane">
          <p class="text-soft text-center mt-5">Select a room on the left, create one, or join with an invite code.</p>
        </div>

        <div class="composer">
          <input type="text" id="composerInput" class="form-control" placeholder="Type a message…" maxlength="2000" disabled />
          <button class="btn btn-glow px-4" id="sendBtn" disabled>Send</button>
        </div>
      </section>
    </div>
    <p class="small d-none mt-2" id="msg"></p>
  </main>

  <!-- invite / QR modal -->
  <div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content glass glass-strong text-center p-4">
        <h6 class="mb-3">Invite people</h6>
        <div class="qr-frame mx-auto"><img id="qrImg" alt="Invite QR code" width="200" height="200" /></div>
        <p class="mono small mt-3 mb-2 text-break" id="inviteLink"></p>
        <div class="d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-glass btn-sm" id="copyInvite">Copy link</button>
          <button class="btn btn-outline-glass btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/chat.js"></script>
</body>
</html>
