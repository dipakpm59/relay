<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Relay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/relay.css" />
</head>
<body>
  <nav class="navbar glass px-3 mb-4">
    <div class="container">
      <a class="brand-mark" href="/">relay</a>
      <div id="navLinks" class="d-flex gap-3 align-items-center"></div>
    </div>
  </nav>

  <main class="container" style="max-width: 1120px">
    <h1 class="h3 fw-bold mt-2">Admin dashboard</h1>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oMsgs">–</div><div class="stat-l">Messages</div></div></div>
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oToday">–</div><div class="stat-l">Today</div></div></div>
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oRooms">–</div><div class="stat-l">Rooms</div></div></div>
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oUsers">–</div><div class="stat-l">Users</div></div></div>
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oConns">–</div><div class="stat-l">Live sockets</div></div></div>
      <div class="col-6 col-md-2"><div class="glass p-3"><div class="stat-n" id="oBuffers">–</div><div class="stat-l">Room buffers</div></div></div>
    </div>

    <div class="glass p-4 mb-4">
      <h2 class="h6 text-soft">Platform messages — last 30 days</h2>
      <canvas id="platformChart" height="70"></canvas>
    </div>

    <ul class="nav nav-underline mb-3" id="adminTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="rooms">Rooms</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="users">Users</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="messages">Messages</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="logs">Audit log</button></li>
    </ul>

    <section id="tab-rooms">
      <div class="d-flex gap-2 mb-2 flex-wrap">
        <input type="text" id="roomSearch" class="form-control form-control-sm w-auto" placeholder="Search room name…" />
        <div class="form-check form-switch small align-self-center">
          <input class="form-check-input" type="checkbox" id="showArchived" />
          <label class="form-check-label text-soft" for="showArchived">Include archived</label>
        </div>
      </div>
      <div class="glass p-2 table-responsive mb-4">
        <table class="table align-middle m-0">
          <thead><tr><th>Room</th><th>Owner</th><th>Members</th><th>Messages</th><th>Status</th><th></th></tr></thead>
          <tbody id="adminRoomsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-users" class="d-none">
      <div class="glass p-2 table-responsive mb-4">
        <table class="table align-middle m-0">
          <thead><tr><th>Name</th><th>Email</th><th>Messages</th><th>Status</th><th>Joined</th><th></th></tr></thead>
          <tbody id="adminUsersBody"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-messages" class="d-none">
      <input type="text" id="msgSearch" class="form-control form-control-sm w-auto mb-2" placeholder="Search message text…" />
      <div class="glass p-2 table-responsive mb-4">
        <table class="table align-middle m-0">
          <thead><tr><th>When</th><th>Room</th><th>From</th><th>Message</th><th>Status</th><th></th></tr></thead>
          <tbody id="adminMsgsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-logs" class="d-none">
      <div class="glass p-2 table-responsive mb-4">
        <table class="table align-middle m-0">
          <thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
          <tbody id="adminLogsBody"></tbody>
        </table>
      </div>
    </section>

    <p class="small d-none" id="msg"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
